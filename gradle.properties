# JVM args for the Gradle daemon. 2 GB is comfortable for a Compose + Room build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; no legacy support-library translation needed.
android.useAndroidX=true
android.enableJetifier=false

# Each library gets its own non-transitive R class -> faster incremental builds.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
