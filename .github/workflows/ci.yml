name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties.
      # If it doesn't, Gradle ignores this JDK and downloads its own from
      # foojay on every cold cache. The app still targets Java 17 bytecode
      # (app/build.gradle.kts compileOptions) — this is only the daemon's JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4

      # API 37 platforms ship under the minor-version scheme (android-37.0,
      # -37.1, ...); there is no bare "platforms;android-37" package.
      - name: Install compileSdk platform + build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests + lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
